name: Build

on:
  push:
    branches: [ main, 'claude/**', 'feature/**' ]
  pull_request:
  workflow_dispatch:
  # Used by the beta release workflow, which only drafts a release once all of this has passed.
  workflow_call:
    outputs:
      version:
        description: Version built (e.g. 0.7.0-beta.1)
        value: ${{ jobs.windows-x64.outputs.version }}

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from the release workflow, so a release build never cancels
  # (or is cancelled by) an ordinary push build of the same branch.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  mail-integration:
    name: Mail engine integration (IMAP/SMTP test server)
    # Pinned: the test server config uses Dovecot 2.3 syntax (Ubuntu 24.04); Dovecot 2.4 changed it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start a disposable IMAP/SMTP server (Dovecot + Postfix, loopback only)
        run: bash scripts/ci/setup-test-mail-server.sh

      # Throwaway users on a local test server only. No real or production accounts are ever used in CI.
      - name: Run unit and integration tests
        env:
          SIDEPHASE_TEST_IMAP_HOST: 127.0.0.1
          SIDEPHASE_TEST_IMAP_PORT: 1993
          SIDEPHASE_TEST_SMTP_PORT: 1587
          SIDEPHASE_TEST_SMTP_SECURITY: starttls
        run: >
          dotnet test tests/SidePhase.Mail.Tests/SidePhase.Mail.Tests.csproj -c Release
          --logger "trx;LogFileName=integration-results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/integration-results

      - name: Run integration tests with IMAP STARTTLS and implicit-TLS SMTP
        env:
          SIDEPHASE_TEST_IMAP_HOST: 127.0.0.1
          SIDEPHASE_TEST_IMAP_PORT: 1143
          SIDEPHASE_TEST_IMAP_SECURITY: starttls
          SIDEPHASE_TEST_SMTP_PORT: 1465
        run: dotnet test tests/SidePhase.Mail.Tests/SidePhase.Mail.Tests.csproj -c Release --filter "FullyQualifiedName~Integration"

      - name: Mail server logs
        if: failure()
        run: |
          sudo tail -n 200 /var/log/postfix.log || true
          sudo journalctl -u dovecot --no-pager -n 200 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/integration-results
          if-no-files-found: ignore

  windows-x64:
    name: Windows x64 (build, test, package)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show toolchain
        run: |
          dotnet --info
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $prefix = $props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          $suffix = $props.Project.PropertyGroup.VersionSuffix | Where-Object { $_ } | Select-Object -First 1
          $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$version+$short" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          Write-Host "SidePhase Mail $version (commit $short)"

      - name: Restore
        run: |
          dotnet restore tests/SidePhase.Mail.Tests/SidePhase.Mail.Tests.csproj
          dotnet restore src/SidePhase.Mail.App/SidePhase.Mail.App.csproj -p:Platform=x64 -r win-x64

      - name: Run unit tests
        run: >
          dotnet test tests/SidePhase.Mail.Tests/SidePhase.Mail.Tests.csproj
          -c $env:CONFIGURATION --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      - name: Build and publish SidePhase Mail (self-contained, unpackaged)
        run: >
          dotnet publish src/SidePhase.Mail.App/SidePhase.Mail.App.csproj
          -c $env:CONFIGURATION -r win-x64 -p:Platform=x64 --no-restore
          -o artifacts/SidePhaseMail-win-x64
          -p:SourceRevisionId=${{ github.sha }}
          -bl:artifacts/logs/publish.binlog

      - name: Verify the application was produced
        shell: pwsh
        run: |
          $out = "artifacts/SidePhaseMail-win-x64"
          $required = @(
            "SidePhaseMail.exe",
            "SidePhaseMail.dll",
            "SidePhase.Mail.Core.dll",
            "SidePhase.Mail.Infrastructure.dll",
            "Microsoft.WinUI.dll",
            "Microsoft.Web.WebView2.Core.dll",
            "SidePhaseMail.pri",
            "SidePhase.Mail.Advertising.dll",
            "THIRD-PARTY-NOTICES.txt",
            "Assets/AppIcon.ico"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $out $_)) }
          if ($missing) {
            Write-Host "Published folder contents:"
            Get-ChildItem $out | Select-Object -First 200 | Format-Table Name, Length
            Write-Error "Missing expected files: $($missing -join ', ')"
            exit 1
          }
          $exe = Get-Item (Join-Path $out "SidePhaseMail.exe")
          if ($exe.Length -lt 50KB) { Write-Error "SidePhaseMail.exe looks invalid ($($exe.Length) bytes)"; exit 1 }
          $size = (Get-ChildItem $out -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Application folder OK: {0:N1} MB, {1} files" -f $size, (Get-ChildItem $out -Recurse -File).Count)

      - name: Smoke test (launch the app and keep it running)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/smoke | Out-Null
          $env:SIDEPHASE_NO_ERROR_DIALOG = "1"
          $exe = Resolve-Path artifacts/SidePhaseMail-win-x64/SidePhaseMail.exe
          $data = Join-Path $env:LOCALAPPDATA "SidePhase Mail"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing

          function Test-Launch([string] $name) {
            $start = Get-Date
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 25
            $p.Refresh()
            $alive = -not $p.HasExited
            Write-Host "[$name] running after 25 s: $alive   window title: '$($p.MainWindowTitle)'"
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$PWD/artifacts/smoke/$name.png")
            } catch { Write-Host "Screenshot not available: $_" }
            if ($alive) { Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 2 } else { Write-Host "[$name] exit code: $($p.ExitCode)" }

            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting', 'SideBySide', 'Application Hang') } |
              Format-List TimeCreated, ProviderName, Id, Message | Out-String -Width 400 | Tee-Object "artifacts/smoke/$name-eventlog.txt"
            $logs = Join-Path $data "Logs"
            if (Test-Path $logs) {
              Get-ChildItem $logs | ForEach-Object {
                Write-Host "---- [$name] $($_.Name) ----"; Get-Content $_.FullName
                Copy-Item $_.FullName "artifacts/smoke/$name-$($_.Name)"; Remove-Item $_.FullName
              }
            }
            return $alive
          }

          # 1. First run: welcome screen.
          $first = Test-Launch "first-run"

          # 2. Returning user: straight into the inbox (message list and sidebar counts).
          New-Item -ItemType Directory -Force $data | Out-Null
          '{ "hasCompletedWelcome": true }' | Set-Content -Encoding utf8 (Join-Path $data "settings.json")
          $env:SIDEPHASE_OPEN_FIRST_MESSAGE = "1"
          $inbox = Test-Launch "inbox"

          if (-not ($first -and $inbox)) { Write-Error "SidePhase Mail exited during start-up (first run: $first, inbox: $inbox)."; exit 1 }

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: artifacts/smoke/
          if-no-files-found: ignore

      - name: Add run instructions
        shell: pwsh
        run: |
          @"
          SidePhase Mail ${{ steps.version.outputs.version }} - portable build (Windows x64)
          =================================================================

          1. Extract this whole folder anywhere (for example your Desktop).
          2. Double-click SidePhaseMail.exe.

          No installer is needed: .NET and the Windows App SDK are bundled. Data is kept in
          %LOCALAPPDATA%\SidePhase Mail. The installed (MSIX) app keeps its own data and copies yours from
          here the first time it starts (see docs/PACKAGING.md).

          Requirements: Windows 10 1809+ (Windows 11 recommended for the Mica glass effect) and the
          Microsoft Edge WebView2 Runtime (pre-installed on Windows 11).

          Windows SmartScreen may warn because the build is unsigned: choose "More info" > "Run anyway".
          This is a beta: see docs/BETA_TESTING.md and RELEASE_READINESS.md.

          Version: ${{ steps.version.outputs.label }}
          Commit:  $env:GITHUB_SHA
          "@ | Set-Content -Encoding utf8 artifacts/SidePhaseMail-win-x64/README-FIRST.txt

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: SidePhaseMail-${{ steps.version.outputs.version }}-win-x64-portable
          path: artifacts/SidePhaseMail-win-x64/
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------ MSIX (installed / Store build)

      - name: Build the MSIX package (unsigned)
        run: >
          dotnet build src/SidePhase.Mail.App/SidePhase.Mail.App.csproj
          -c $env:CONFIGURATION -r win-x64 -p:Platform=x64
          -p:SidePhasePackage=msix
          -p:SourceRevisionId=${{ github.sha }}
          -bl:artifacts/logs/msix.binlog

      - name: Verify the MSIX package
        id: msix
        shell: pwsh
        run: |
          $msix = Get-ChildItem artifacts/msix -Recurse -Filter *.msix | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
          if (-not $msix) {
            Get-ChildItem artifacts/msix -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            Write-Error "No .msix package was produced."; exit 1
          }
          Write-Host "Package: $($msix.FullName) ($([math]::Round($msix.Length / 1MB, 1)) MB)"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entry = $zip.Entries | Where-Object FullName -eq 'AppxManifest.xml'
            $reader = New-Object IO.StreamReader($entry.Open()); [xml] $manifest = $reader.ReadToEnd(); $reader.Close()
            $names = $zip.Entries.FullName
          } finally { $zip.Dispose() }

          $identity = $manifest.Package.Identity
          Write-Host "Identity: $($identity.Name) $($identity.Version) $($identity.ProcessorArchitecture), publisher '$($identity.Publisher)'"
          $deps = @($manifest.Package.Dependencies.PackageDependency | ForEach-Object { "$($_.Name) >= $($_.MinVersion)" })
          Write-Host "Package dependencies: $($deps -join '; ')"
          $problems = @()
          if ($identity.Name -ne 'SidePhaseStudio.SidePhaseMail') { $problems += "unexpected identity name" }
          if ($identity.ProcessorArchitecture -ne 'x64') { $problems += "not an x64 package" }
          if (-not ($deps -match 'Microsoft.WindowsAppRuntime')) { $problems += "no Windows App Runtime dependency" }
          if (-not ($manifest.OuterXml -match 'windows.protocol')) { $problems += "mailto: registration missing" }
          foreach ($file in 'SidePhaseMail.exe', 'SidePhaseMail.dll', 'SidePhase.Mail.Core.dll', 'SidePhase.Mail.Infrastructure.dll', 'SidePhase.Mail.Advertising.dll', 'THIRD-PARTY-NOTICES.txt', 'resources.pri') {
            if (-not ($names -contains $file)) { $problems += "missing $file" }
          }
          if (-not ($names -match '^Assets/Package/Square44x44Logo')) { $problems += "missing package images" }
          if ($problems) { Write-Error ("MSIX check failed: " + ($problems -join ', ')); exit 1 }
          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          "folder=$($msix.DirectoryName)" >> $env:GITHUB_OUTPUT

      # Proves the package installs, starts and uninstalls cleanly. The signing certificate is created on the runner
      # for this one test, used only to sign the copy installed here, and never exported or uploaded: the artifact
      # below stays unsigned.
      - name: MSIX install, launch and uninstall test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/smoke | Out-Null
          $env:SIDEPHASE_NO_ERROR_DIALOG = "1"
          $work = Join-Path $env:RUNNER_TEMP "msix-test"
          New-Item -ItemType Directory -Force $work | Out-Null
          $copy = Join-Path $work (Split-Path "${{ steps.msix.outputs.path }}" -Leaf)
          Copy-Item "${{ steps.msix.outputs.path }}" $copy

          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=SidePhase Studio (development)' -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -NotAfter (Get-Date).AddDays(1)
          $store = New-Object Security.Cryptography.X509Certificates.X509Store 'TrustedPeople', 'LocalMachine'
          $store.Open('ReadWrite'); $store.Add([Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData)); $store.Close()
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $copy
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed"; exit 1 }

          $deps = Join-Path "${{ steps.msix.outputs.folder }}" "Dependencies\x64"
          $install = @{ Path = $copy }
          if (Test-Path $deps) { $install.DependencyPath = @(Get-ChildItem $deps -Filter *.msix | ForEach-Object FullName) }
          Add-AppxPackage @install
          $pkg = Get-AppxPackage -Name 'SidePhaseStudio.SidePhaseMail'
          if (-not $pkg) { Write-Error "The package didn't install."; exit 1 }
          Write-Host "Installed $($pkg.PackageFullName) at $($pkg.InstallLocation)"

          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!App"
          Start-Sleep -Seconds 25
          $proc = Get-Process SidePhaseMail -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($pkg.InstallLocation)*" }
          $alive = [bool] $proc
          Write-Host "Installed app running after 25 s: $alive"
          $data = Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)\LocalState"
          if (Test-Path "$data\Logs") { Get-ChildItem "$data\Logs" | ForEach-Object { Write-Host "---- $($_.Name) ----"; Get-Content $_.FullName; Copy-Item $_.FullName "artifacts/smoke/msix-$($_.Name)" } }
          # The portable smoke test above left data in %LOCALAPPDATA%\SidePhase Mail: the installed app must have copied it
          # (settings + marker) on first start, without changing the original.
          $imported = Test-Path (Join-Path $data "imported-from-portable.json")
          $settingsCopied = Test-Path (Join-Path $data "settings.json")
          $portableKept = Test-Path (Join-Path $env:LOCALAPPDATA "SidePhase Mail\settings.json")
          Write-Host "Data folder: $data (exists: $(Test-Path $data)); copied from portable: $imported, settings: $settingsCopied, portable copy kept: $portableKept"
          if ($proc) { $proc | Stop-Process -Force; Start-Sleep -Seconds 2 }

          Remove-AppxPackage -Package $pkg.PackageFullName
          $left = Get-AppxPackage -Name 'SidePhaseStudio.SidePhaseMail'
          $dataLeft = Test-Path $data
          Write-Host "After uninstall: package present: $([bool]$left), data folder present: $dataLeft"
          Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Thumbprint -eq $cert.Thumbprint | Remove-Item
          Remove-Item $cert.PSPath

          if (-not $alive) { Write-Error "The installed app didn't stay running."; exit 1 }
          if (-not ($imported -and $settingsCopied -and $portableKept)) { Write-Error "The portable build's data wasn't copied into the installed app (or the original changed)."; exit 1 }
          if ($left) { Write-Error "The package is still installed after Remove-AppxPackage."; exit 1 }

      - name: Add MSIX install instructions
        shell: pwsh
        run: |
          Copy-Item scripts/packaging/Install-DevPackage.ps1 "${{ steps.msix.outputs.folder }}/"
          @"
          SidePhase Mail ${{ steps.version.outputs.version }} - MSIX package (Windows x64, UNSIGNED beta)
          ======================================================================

          This package is not signed (no signing key is kept in CI), so Windows won't install it as it is.
          To try it on a test PC, open PowerShell as administrator in this folder and run:

              .\Install-DevPackage.ps1 -Package .\$(Split-Path "${{ steps.msix.outputs.path }}" -Leaf)

          The script creates a test certificate on your PC only, signs the package, installs the Windows App
          Runtime from Dependencies\ and installs SidePhase Mail. Remove the certificate afterwards with
          .\Install-DevPackage.ps1 -RemoveCertificate. Full details: docs/PACKAGING.md.

          The installed app copies accounts and settings from the portable build the first time it starts
          (the portable copy is left untouched).

          Version: ${{ steps.version.outputs.label }}
          Commit:  $env:GITHUB_SHA
          "@ | Set-Content -Encoding utf8 "${{ steps.msix.outputs.folder }}/README-FIRST.txt"

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: SidePhaseMail-${{ steps.version.outputs.version }}-win-x64-msix
          path: ${{ steps.msix.outputs.folder }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: artifacts/logs/
          if-no-files-found: ignore
